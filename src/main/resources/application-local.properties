# ===================================================
# LOKALNI PROFIL - pokreni sa: --spring.profiles.active=local
# Koristi H2 in-memory bazu, ne treba PostgreSQL!
# ===================================================

# H2 in-memory baza (PostgreSQL kompatibilni mode)
spring.datasource.url=jdbc:h2:mem:usedcarsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 konzola (dostupna na http://localhost:9000/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# Server port
server.port=9000

# JWT
jwt.secret=mySecretKeyForJwtTokenGenerationThatIsAtLeast256BitsLong!!
jwt.expiration=86400000

# File upload
file.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
